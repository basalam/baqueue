[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baqueue"
version = "0.1.0"
description = "A powerful Python queue management package inspired by Laravel Horizon"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "BaQueue Contributors"}]
keywords = ["queue", "job", "worker", "scheduler", "horizon", "redis", "postgres"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "croniter>=2.0",
    "redis[hiredis]>=5.0",
    "asyncpg>=0.29",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[project.optional-dependencies]
redis = ["redis[hiredis]>=5.0"]
postgres = ["asyncpg>=0.29"]
dashboard = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]
all = [
    "redis[hiredis]>=5.0",
    "asyncpg>=0.29",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
baqueue = "baqueue.cli:cli"

[tool.setuptools.packages.find]
include = ["baqueue*"]

[tool.setuptools.package-data]
"baqueue.dashboard" = ["static/**/*"]
